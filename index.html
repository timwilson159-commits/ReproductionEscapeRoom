<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biology Escape: Station Genesis</title>
<meta name="description" content="A 15-minute escape room covering reproduction in plants, fungi, bacteria and animals for Year 12 Biology.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>">
</head>
<body>
<div id="bubbles" aria-hidden="true"></div>

<header id="topbar">
  <div class="brand"><span class="brand-icon">🧬</span><div><h1>Biology Escape</h1><p>Research Station Genesis</p></div></div>
  <div class="hud">
    <div class="hud-pill" title="Codes found"><span>🔑</span> <b id="hud-codes">0 / 4</b></div>
    <div class="hud-pill" title="Time"><span>⏱️</span> <b id="hud-time">00:00</b></div>
    <button class="icon-btn" id="btn-sound" title="Sound on/off" aria-label="Sound on or off">🔊</button>
    <button class="icon-btn" id="btn-help" title="How to play" aria-label="How to play">❓</button>
  </div>
</header>

<main id="app">
  <section id="room-view">
    <div class="room-wrap">
      <canvas id="room" width="960" height="672" aria-label="Top-down view of the biology lab. Move with arrow keys or WASD, or click to walk."></canvas>
      <div id="prompt" class="prompt" hidden></div>
    </div>
    <p class="controls-tip">Move: <kbd>WASD</kbd>/<kbd>Arrows</kbd> or click the floor &nbsp;·&nbsp; Open a station: <kbd>E</kbd> / <kbd>Space</kbd> or click it</p>
  </section>

  <aside id="notes">
    <div class="notes-head">
      <h2>📓 Lab Notes</h2>
      <p>Codes you find are saved here automatically.</p>
    </div>
    <ol id="notes-list"></ol>
    <div class="notes-foot">
      <p>🚪 The vault needs <b>all 4 codes</b> and the key word:</p>
      <div class="keyword">GENE</div>
    </div>
  </aside>

  <section id="puzzle-view" hidden></section>
</main>

<div id="modal-root"></div>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/extras.js"></script>
<script src="js/art.js"></script>
<script src="js/puzzles/vocab.js"></script>
<script src="js/puzzles/fertilise.js"></script>
<script src="js/puzzles/kingdoms.js"></script>
<script src="js/puzzles/advantages.js"></script>
<script src="js/door.js"></script>
<script src="js/main.js"></script>
</body>
</html>
